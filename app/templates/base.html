<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ABB Automated{% endblock %}</title>
    <link rel="icon" href="{{ static_versioned('images/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ static_versioned('images/icon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ static_versioned('images/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ static_versioned('images/favicon-48.png') }}">
    <link rel="apple-touch-icon" href="{{ static_versioned('images/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ static_versioned('css/style.css') }}">
    {% block extra_css %}{% endblock %}
    {% block extra_js %}{% endblock %}
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('search') }}" class="navbar-logo" aria-label="ABB Automated home">
            <img src="{{ static_versioned('images/icon.svg') }}" alt="">
        </a>
        <div class="navbar-links">
            <a href="{{ url_for('search') }}" class="{% if request.endpoint == 'search' %}active{% endif %}">Search</a>
            <a href="{{ url_for('status') }}" class="{% if request.endpoint == 'status' %}active{% endif %}">Status</a>
            <a href="{{ url_for('mappings_page') }}" class="{% if request.endpoint == 'mappings_page' %}active{% endif %}">Series Mappings</a>
            {% if nav_link_name and nav_link_url %}
            <a href="{{ nav_link_url }}" target="_blank">{{ nav_link_name }}</a>
            {% endif %}
        </div>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
