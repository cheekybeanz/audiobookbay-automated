<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a4a1a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5a4a1a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5a4a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideFade" x1="0" y1="345" x2="0" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0a400" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0a400" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bookClip">
      <path d="M256 220
               C 226 196, 176 182, 130 186
               C 124 186, 120 190, 120 196
               L 120 336
               C 120 342, 124 346, 130 345
               C 176 341, 226 354, 256 378
               Z"/>
      <path d="M256 220
               C 286 196, 336 182, 382 186
               C 388 186, 392 190, 392 196
               L 392 336
               C 392 342, 388 346, 382 345
               C 336 341, 286 354, 256 378
               Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="#16172a"/>

  <g transform="translate(256,266) scale(1.5) translate(-256,-266)">
    <!-- side trim: connects to the bottom trim, tapers off a bit higher up the
         page now, flat cap so it doesn't overshoot at the bottom junction -->
    <path d="M130 345 C 124 346, 120 342, 120 336 L 120 196 C 120 190, 124 186, 130 186"
          fill="none" stroke="url(#sideFade)" stroke-width="8" stroke-linecap="butt"/>
    <path d="M382 345 C 388 346, 392 342, 392 336 L 392 196 C 392 190, 388 186, 382 186"
          fill="none" stroke="url(#sideFade)" stroke-width="8" stroke-linecap="butt"/>

    <!-- bottom cover trim -->
    <path d="M130 345 C 176 341, 226 354, 256 378" fill="none" stroke="#e0a400" stroke-width="8" stroke-linecap="round"/>
    <path d="M382 345 C 336 341, 286 354, 256 378" fill="none" stroke="#e0a400" stroke-width="8" stroke-linecap="round"/>

    <!-- open book, pages are pale — color belongs to the cover trim, not the paper -->
    <path d="M256 220
             C 226 196, 176 182, 130 186
             C 124 186, 120 190, 120 196
             L 120 336
             C 120 342, 124 346, 130 345
             C 176 341, 226 354, 256 378
             Z"
          fill="#f5efe0"/>
    <path d="M256 220
             C 286 196, 336 182, 382 186
             C 388 186, 392 190, 392 196
             L 392 336
             C 392 342, 388 346, 382 345
             C 336 341, 286 354, 256 378
             Z"
          fill="#f5efe0"/>

    <!-- spine crease shadow, clipped to the book's actual outline (both curves,
         both edges) so it conforms everywhere instead of guessing a rectangle
         and creating a hard edge across the top -->
    <rect x="196" y="150" width="120" height="260" fill="url(#crease)" clip-path="url(#bookClip)"/>
    <line x1="256" y1="222" x2="256" y2="380" stroke="#b8a05a" stroke-width="2" opacity="0.6"/>

    <!-- page lines, warm gray so they read against the pale page now -->
    <path d="M144 214 C 176 214, 204 224, 224 238" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M144 246 C 176 246, 204 256, 224 270" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M144 278 C 176 278, 204 288, 224 302" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M144 310 C 176 310, 204 320, 224 334" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M368 214 C 336 214, 308 224, 288 238" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M368 246 C 336 246, 308 256, 288 270" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M368 278 C 336 278, 308 288, 288 302" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M368 310 C 336 310, 308 320, 288 334" stroke="#cbbf9c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- sound bars rising from the spine, centered on x=256 -->
    <rect x="225" y="118" width="14" height="46" rx="7" fill="#f2b705"/>
    <rect x="249" y="96"  width="14" height="68" rx="7" fill="#f2b705"/>
    <rect x="273" y="128" width="14" height="36" rx="7" fill="#f2b705"/>
  </g>
</svg>
